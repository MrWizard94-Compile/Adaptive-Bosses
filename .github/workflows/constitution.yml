name: Pinned Constitution adoption and project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adoption:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Adaptive Bosses
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out accepted WPAI Constitution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MrWizard94-Compile/Agents-Constitution
          ref: 69830722d809244e1dfe2f6cd33f0e7dbbaacf5c
          path: constitution
          persist-credentials: false

      - name: Validate canonical source and tests
        working-directory: constitution
        run: |
          python3 tools/validate-source.py
          python3 -m unittest discover -s tests -v

      - name: Check project adoption
        run: python3 constitution/tools/check-adoption.py project

  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Adaptive Bosses
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile, test, analyze, and run GameTests
        run: ./gradlew check --warning-mode all
